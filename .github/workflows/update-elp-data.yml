name: Update ELP Data

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST / 2 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Download Violations CSV
      run: |
        echo "Downloading violations CSV from FMCSA..."
        # Download ALL Part 391 violations (no change_date filter).
        # The Python script filters for ELP (11B2) sections, and the
        # inspections step handles date filtering via insp_date >= 2025.
        # We avoid filtering by change_date because FMCSA data reprocessing
        # can shift change_dates, causing recent violations to be missed.
        # Limit raised from 500K to 2M (Oct 2026: dataset exceeded 500K,
        # silently dropping recent violations and missing Oct data entirely).
        curl -o violations.csv "https://data.transportation.gov/resource/876r-jsdb.csv?\$where=part_no=%27391%27&\$limit=2000000"
        VIOL_LINES=$(wc -l < violations.csv)
        echo "Violations CSV downloaded: $VIOL_LINES lines"
        if [ "$VIOL_LINES" -ge 1999999 ]; then
          echo "::warning::Violations CSV hit the 2M row limit — raise \$limit to avoid truncating recent data"
        fi

    - name: Download Inspections CSV
      run: |
        echo "Downloading inspections CSV from FMCSA..."
        # Download inspections CSV with date filter only
        # Filter: INSP_DATE >= 2025-01-01
        # Limit raised from 5M to 10M (Oct 2026: ~22 months of inspections
        # at ~3.5M/year was approaching the 5M cap).
        curl -o inspections.csv "https://data.transportation.gov/resource/fx4q-ay7w.csv?\$where=insp_date%20%3E=%20%272025-01-01T00:00:00%27&\$limit=10000000"
        INSP_LINES=$(wc -l < inspections.csv)
        echo "Inspections CSV downloaded: $INSP_LINES lines"
        if [ "$INSP_LINES" -ge 9999999 ]; then
          echo "::warning::Inspections CSV hit the 10M row limit — raise \$limit to avoid truncating recent data"
        fi
        
    - name: Run data processing script
      run: |
        echo "Processing CSVs and generating elp_data.json..."
        python csv_to_json_optimized.py
        
    - name: Regression check
      id: regression_check
      run: |
        # Compare new total_oos against existing to catch data regressions
        NEW_OOS=$(python -c "import json; print(json.load(open('elp_data.json'))['total_oos'])")
        git show HEAD:elp_data.json > /tmp/old_elp_data.json 2>/dev/null || echo '{"total_oos":0}' > /tmp/old_elp_data.json
        OLD_OOS=$(python -c "import json; print(json.load(open('/tmp/old_elp_data.json'))['total_oos'])")
        echo "Old OOS: $OLD_OOS → New OOS: $NEW_OOS"
        if [ "$OLD_OOS" -gt 0 ] && [ "$NEW_OOS" -lt $((OLD_OOS * 80 / 100)) ]; then
          echo "✗ REGRESSION DETECTED: new total_oos ($NEW_OOS) is >20% below previous ($OLD_OOS)"
          echo "Aborting to prevent publishing bad data."
          exit 1
        fi

    - name: Check if data changed
      id: check_changes
      run: |
        if git diff --quiet elp_data.json; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes detected in elp_data.json"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected in elp_data.json"
        fi
        
    - name: Commit and push if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add elp_data.json
        git commit -m "Auto-update ELP data - $(date +'%Y-%m-%d')"
        git push
        
    - name: Clean up CSV files
      if: always()
      run: |
        rm -f violations.csv inspections.csv
        
    - name: Summary
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        echo "✓ ELP data updated successfully!"
        echo "Dashboard will refresh automatically at: https://bkwiseman-del.github.io/elp-dashboard-data/"
